<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One World Formations - Pour les Réfugiés</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root { --lime: #00ff41; --dark: #000; --gray: #555; }
        body { font-family: 'Segoe UI', sans-serif; background:#f8f9fa; margin:0; color:#333; }

        .top-header { background: var(--dark); padding: 2.5rem 0; }
        .header-content { max-width: 1400px; margin: 0 auto; padding: 0 5%; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 3.8rem; font-weight: 900; font-style: italic; color: var(--lime); letter-spacing: -2px; }
        .nav-menu { display: flex; gap: 2.5rem; font-weight: 600; font-size: 1.1rem; }
        .nav-menu a { color: white; text-decoration: none; padding: 0.6rem 1.2rem; border-radius: 30px; transition: 0.3s; }
        .nav-menu a:hover, .nav-menu a.active { background: var(--lime); color: black; }
        .nav-menu a.admin-btn { background: #333; color: var(--lime); border: 2px solid var(--lime); }

        .title-section { text-align: center; padding: 3rem 0 2rem; background: white; }
        .main-title { font-size: 2.8rem; color: var(--gray); font-weight: 300; margin: 0; }
        .subtitle { color: #777; font-size: 1.1rem; margin-top: 0.5rem; }

        .btn-inscrire { background: var(--lime); color: black; font-weight: bold; padding: 1rem 3rem; border-radius: 50px; font-size: 1.3rem; border: none; box-shadow: 0 6px 20px rgba(0,255,65,0.4); margin: 2rem auto; display: block; }

        .formation-card { background: white; border-left: 6px solid var(--lime); border-radius: 15px; padding: 2rem; margin-bottom: 2rem; box-shadow: 0 6px 20px rgba(0,0,0,0.1); transition: 0.3s; }
        .formation-card:hover { transform: translateY(-10px); }
        .card-id { background: var(--lime); color: black; padding: 0.5rem 1.2rem; border-radius: 30px; font-weight: bold; }
        .meet-link { background: #0d8bf0; color: white; padding: 0.7rem 1.6rem; border-radius: 30px; text-decoration: none; font-weight: bold; display: inline-flex; align-items: center; gap: 8px; }
        .badge-live { background: #ff3b30; color: white; padding: 0.5rem 1rem; border-radius: 30px; }
        .badge-classic { background: #6c757d; color: white; padding: 0.5rem 1rem; border-radius: 30px; }

        /* Toast pour message automatique */
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
    </style>
</head>
<body>

    <!-- TOAST CONTAINER -->
    <div class="toast-container" id="toastContainer"></div>

    <header class="top-header">
        <div class="header-content">
            <div class="logo">Fame</div>
            <div class="nav-menu">
                <a href="#">HOME</a>
                <a href="#" class="active">FORMATIONS</a>
                <a href="#">CONTACT</a>
                <a href="admin.html" class="admin-btn">ADMIN</a>
            </div>
        </div>
    </header>

    <div class="title-section">
        <h1 class="main-title">FORMATIONS GRATUITES POUR RÉFUGIÉS</h1>
        <p class="subtitle">En direct ou à votre rythme – partout dans le monde</p>
    </div>

    <div class="container">
        <div class="text-center">
            <button class="btn btn-inscrire" data-bs-toggle="modal" data-bs-target="#inscriptionModal">
                S'inscrire gratuitement
            </button>
        </div>

        <h3 class="text-center my-5">Formations EN DIRECT via Google Meet</h3>
        <div class="row" id="formationsLive"></div>

        <h3 class="text-center my-5">Formations CLASSIQUES (à ton rythme)</h3>
        <div class="row" id="formationsClassiques"></div>
    </div>

    <!-- MODAL INSCRIPTION -->
    <div class="modal fade" id="inscriptionModal">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header" style="background:var(--lime); color:black;">
                    <h5 class="modal-title">Inscription - Programme Réfugiés</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="inscriptionForm">
                        <div class="row g-3">
                            <div class="col-md-6"><label>Nom complet *</label><input type="text" class="form-control" id="nom" required></div>
                            <div class="col-md-6"><label>Pays actuel *</label><input type="text" class="form-control" id="pays" required></div>
                            <div class="col-md-6"><label>ID Réfugié (facultatif)</label><input type="text" class="form-control" id="idRefugie"></div>
                            <div class="col-md-6"><label>Email ou WhatsApp *</label><input type="text" class="form-control" id="contact" required></div>
                            <div class="col-12"><label>Formation souhaitée *</label><select class="form-select form-select-lg" id="formationSelect" required></select></div>
                            <div class="col-12">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="consent" required>
                                    <label class="form-check-label">J'accepte de recevoir les accès aux cours</label>
                                </div>
                            </div>
                        </div>
                        <button type="submit" class="btn w-100 mt-4" style="background:var(--lime); color:black; font-weight:bold; padding:1.2rem; font-size:1.1rem;">
                            Confirmer mon inscription
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const KEY_REFUGIES = "oneWorldRefugies";

        const liveCourses = [
            { id: 1, nom: "Développement Web FullStack", formateur: "M. Diallo", meet: "https://meet.google.com/web-2025" },
            { id: 2, nom: "Marketing Digital", formateur: "Mme Konaté", meet: "https://meet.google.com/marketing-2025" },
            { id: 3, nom: "Anglais Professionnel", formateur: "Mr. Smith", meet: "https://meet.google.com/english-2025" }
        ];

        const classicCourses = [
            { id: 10, nom: "Initiation à l'Informatique", duree: "40h" },
            { id: 11, nom: "Français Langue Étrangère", duree: "60h" },
            { id: 12, nom: "Entrepreneuriat", duree: "30h" },
            { id: 13, nom: "Excel & Tableurs", duree: "25h" }
        ];

        const allCourses = [...liveCourses, ...classicCourses];

        function loadFormations() {
            const live = document.getElementById("formationsLive");
            const classic = document.getElementById("formationsClassiques");
            const select = document.getElementById("formationSelect");
            live.innerHTML = ""; classic.innerHTML = ""; select.innerHTML = '<option value="">Choisir une formation</option>';

            liveCourses.forEach(f => {
                live.innerHTML += `<div class="col-lg-6 mb-4"><div class="formation-card">
                    <div class="d-flex justify-content-between mb-3"><span class="card-id">#${f.id}</span><span class="badge-live">EN DIRECT</span></div>
                    <h4>${f.nom}</h4>
                    <p class="text-muted"><strong>Formateur :</strong> ${f.formateur}</p>
                    <a href="${f.meet}" target="_blank" class="meet-link">Rejoindre la classe</a>
                </div></div>`;
                const opt = document.createElement("option"); opt.value = f.id; opt.textContent = `[LIVE] ${f.nom}`; select.appendChild(opt);
            });

            classicCourses.forEach(f => {
                classic.innerHTML += `<div class="col-lg-6 mb-4"><div class="formation-card">
                    <div class="d-flex justify-content-between mb-3"><span class="card-id">#${f.id}</span><span class="badge-classic">À TON RYTHME</span></div>
                    <h4>${f.nom}</h4>
                    <p class="text-muted"><strong>Durée :</strong> ${f.duree}</p>
                </div></div>`;
                const opt = document.createElement("option"); opt.value = f.id; opt.textContent = `[CLASSIQUE] ${f.nom}`; select.appendChild(opt);
            });
        }

        // INSCRIPTION – SAUVEGARDE RÉELLE
        document.getElementById("inscriptionForm").onsubmit = function(e) {
            e.preventDefault();
            const nom = document.getElementById("nom").value.trim();
            const pays = document.getElementById("pays").value.trim();
            const idRefugie = document.getElementById("idRefugie").value.trim();
            const contact = document.getElementById("contact").value.trim();
            const formationId = parseInt(document.getElementById("formationSelect").value);

            if (!nom || !pays || !contact || !formationId) {
                alert("Veuillez remplir tous les champs obligatoires");
                return;
            }

            let refugies = JSON.parse(localStorage.getItem(KEY_REFUGIES) || "[]");
            refugies.push({
                id: Date.now(),
                nom: nom,
                pays: pays,
                idRefugie: idRefugie || null,
                contact: contact,
                formationId: formationId,
                date: new Date().toLocaleString('fr-FR')
            });
            localStorage.setItem(KEY_REFUGIES, JSON.stringify(refugies));

            // Afficher le message automatique sur le site
            const container = document.getElementById("toastContainer");
            const toast = document.createElement("div");
            toast.className = "toast align-items-center text-bg-success border-0";
            toast.innerHTML = `
                <div class="d-flex">
                    <div class="toast-body">Vous êtes inscrit !</div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            `;
            container.appendChild(toast);
            new bootstrap.Toast(toast, {delay: 5000}).show();

            bootstrap.Modal.getInstance(document.getElementById('inscriptionModal')).hide();
            this.reset();
        };

        loadFormations();
    </script>
</body>
</html>
